project:
  create:
  - cmake
  - -B
  - build/debug
  - -DBALK_PROFILE=debug
  - -DCMAKE_BUILD_TYPE=Debug
  - -G
  - Ninja
  - -DCMAKE_C_COMPILER=clang
  - -DCMAKE_CXX_COMPILER=clang++
  - -DBALK_TOOLCHAIN=clang
  - -DBALK_ENABLE_MODULES=ON
  - -DBALK_CXX_STANDARD=20
  adopt:
  - ... a bunch of complicated shit that involves looking at what options are set
  delete:
  - remove balk/
  - remove balk.json
info:
  - read balk.json
config:
  - all use internal logic
  - then update balk.json
fetch:
  info:
  - no cmake
  add:
  - update generated files
  - rerun create
  update:
  - try update generated files
  - rerun create
  - fallback to earlier version if can't update
  delete:
  - rerun create
  - fallback to earlier version if can't update
build:
  - cmake
  - --build
  - build/debug
run:
  - do build
  - then run build/debug/projname
test:
  - do build
  - then run build/debug/test
examples:
  - do build
  - then run build/debug/example
export:
  - do build
  - cmake
  - --build
  - build/debug
  - --target
  - balk_export
clean:
  - remove contents of each one of the directories for build/ and export/
fmt:
  - invoke formatter
lint:
  - invoke linters
